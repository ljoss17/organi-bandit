<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
  </head>

  <body>
    <div class="page">
      <aside class="sidebar">
        <h2>Teams</h2>
        <button type="button" id="browse-teams">Browse teams file...</button>
        <ul id="teams-list"></ul>

        <div class="team-edit-controls">
          <button type="button" id="edit-teams">Edit</button>
          <button type="button" id="add-team" hidden>+</button>
          <button type="button" id="save-teams" hidden>Save</button>
          <button type="button" id="cancel-edit-teams" hidden>Cancel</button>
        </div>

        <div id="teams-status" class="status-message"></div>
      </aside>

      <main class="container">
        <div class="row">
          <img src="/assets/morges_bandits.png" class="logo bandits" alt="Bandits logo" />
          <h1>Organi-Bandit</h1>
          <img src="/assets/morges_bandits.png" class="logo bandits" alt="Bandits logo" />
        </div>

        <div class="field">
          <label for="start-date">Start date</label>
          <input type="date" id="start-date" name="start-date" />
        </div>

        <div class="field">
          <label for="number-fields">Number of fields</label>
          <input type="number" id="number-fields" name="number-fields" min="1" step="1" value="1" />
        </div>

        <div class="field">
          <label for="start-time-hours">Start time</label>
          <input
            type="number"
            id="start-time-hours"
            name="start-time-hours"
            min="0"
            max="23"
            step="1"
            placeholder="HH"
          />
          <span>:</span>
          <input
            type="number"
            id="start-time-minutes"
            name="start-time-minutes"
            min="0"
            max="59"
            step="1"
            placeholder="MM"
          />
        </div>

        <div class="field">
          <label for="time-between-games-hours">Time between games</label>
          <input
            type="number"
            id="time-between-games-hours"
            name="time-between-games-hours"
            min="0"
            max="23"
            step="1"
            placeholder="HH"
          />
          <span>:</span>
          <input
            type="number"
            id="time-between-games-minutes"
            name="time-between-games-minutes"
            min="0"
            max="59"
            step="1"
            placeholder="MM"
          />
        </div>

        <div class="field">
          <label for="start-break-hours">Start break</label>
          <input
            type="number"
            id="start-break-hours"
            name="start-break-hours"
            min="0"
            max="23"
            step="1"
            placeholder="HH"
          />
          <span>:</span>
          <input
            type="number"
            id="start-break-minutes"
            name="start-break-minutes"
            min="0"
            max="59"
            step="1"
            placeholder="MM"
          />
        </div>

        <div class="field">
          <label for="end-break-hours">End break</label>
          <input
            type="number"
            id="end-break-hours"
            name="end-break-hours"
            min="0"
            max="23"
            step="1"
            placeholder="HH"
          />
          <span>:</span>
          <input
            type="number"
            id="end-break-minutes"
            name="end-break-minutes"
            min="0"
            max="59"
            step="1"
            placeholder="MM"
          />
        </div>

        <fieldset class="game-days">
          <legend>Game days</legend>
          <div class="day-options">
            <label><input type="checkbox" name="game-days" value="Mon" /> Monday</label>
            <label><input type="checkbox" name="game-days" value="Tue" /> Tuesday</label>
            <label><input type="checkbox" name="game-days" value="Wed" /> Wednesday</label>
            <label><input type="checkbox" name="game-days" value="Thu" /> Thursday</label>
            <label><input type="checkbox" name="game-days" value="Fri" /> Friday</label>
            <label><input type="checkbox" name="game-days" value="Sat" /> Saturday</label>
            <label><input type="checkbox" name="game-days" value="Sun" /> Sunday</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="output-folder">Output folder</label>
          <input
            type="text"
            id="output-folder"
            name="output-folder"
            readonly
            placeholder="Select a folder..."
          />
          <button type="button" id="browse-output-folder">Browse...</button>
        </div>

        <button type="button" id="generate-schedule">Generate schedule</button>

        <div id="status-message" class="status-message"></div>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
