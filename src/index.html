<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organi-Bandit</title>
  </head>

  <body>
    <div class="page">
      <aside class="sidebar">
        <h2>Teams</h2>
        <button type="button" id="browse-teams" data-i18n="browse-teams"></button>
        <button type="button" id="new-teams-file" data-i18n="new-teams-file"></button>
        <ul id="teams-list"></ul>

        <div class="team-edit-controls">
          <button type="button" id="edit-teams" data-i18n="edit"></button>
          <button type="button" id="add-team" hidden>+</button>
          <button type="button" id="save-teams" hidden data-i18n="save"></button>
          <button type="button" id="cancel-edit-teams" hidden data-i18n="cancel"></button>
        </div>

        <div id="teams-status" class="status-message"></div>
      </aside>

      <main class="container">
        <div class="top-bar">
          <div class="brand">
            <img src="/assets/morges_bandits.png" class="logo bandits" alt="Bandits logo" />
            <h1>Organi-Bandit</h1>
          </div>
          <div class="top-bar-actions">
            <button type="button" id="show-changelog" class="changelog-toggle" data-i18n="changelog-button"></button>
            <select id="language-select" class="language-toggle">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>
        </div>

        <div id="update-status" class="status-message" hidden></div>

        <div class="config-grid">
          <fieldset class="config-group season-window">
            <legend data-i18n="season-window"></legend>
            <div class="field">
              <label for="start-date" data-i18n="start-date"></label>
              <input type="date" id="start-date" name="start-date" />
            </div>
            <div class="field">
              <label for="single-game-per-week" data-i18n="single-game-per-week"></label>
              <input type="checkbox" id="single-game-per-week" name="single-game-per-week" />
            </div>
          </fieldset>

          <fieldset class="config-group slot-mechanics">
            <legend data-i18n="slot-mechanics"></legend>
            <div class="field">
              <label for="number-fields" data-i18n="number-fields"></label>
              <input type="number" id="number-fields" name="number-fields" min="1" step="1" value="1" />
            </div>
            <div class="field">
              <label for="start-time-hours" data-i18n="start-time"></label>
              <input
                type="number"
                id="start-time-hours"
                name="start-time-hours"
                min="0"
                max="23"
                step="1"
                data-i18n-placeholder="hour-placeholder"
              />
              <span>:</span>
              <input
                type="number"
                id="start-time-minutes"
                name="start-time-minutes"
                min="0"
                max="59"
                step="1"
                data-i18n-placeholder="minute-placeholder"
              />
            </div>
            <div class="field">
              <label for="game-duration-hours" data-i18n="game-duration"></label>
              <input
                type="number"
                id="game-duration-hours"
                name="game-duration-hours"
                min="0"
                max="23"
                step="1"
                data-i18n-placeholder="hour-placeholder"
              />
              <span>:</span>
              <input
                type="number"
                id="game-duration-minutes"
                name="game-duration-minutes"
                min="0"
                max="59"
                step="1"
                data-i18n-placeholder="minute-placeholder"
              />
            </div>
            <div class="field">
              <label for="time-between-games-hours" data-i18n="time-between-games"></label>
              <input
                type="number"
                id="time-between-games-hours"
                name="time-between-games-hours"
                min="0"
                max="23"
                step="1"
                data-i18n-placeholder="hour-placeholder"
              />
              <span>:</span>
              <input
                type="number"
                id="time-between-games-minutes"
                name="time-between-games-minutes"
                min="0"
                max="59"
                step="1"
                data-i18n-placeholder="minute-placeholder"
              />
            </div>
          </fieldset>

          <fieldset class="config-group game-days">
            <legend data-i18n="game-days"></legend>
            <div class="day-options">
              <label><input type="checkbox" name="game-days" value="Mon" /> <span data-i18n="day-monday"></span></label>
              <label><input type="checkbox" name="game-days" value="Tue" /> <span data-i18n="day-tuesday"></span></label>
              <label><input type="checkbox" name="game-days" value="Wed" /> <span data-i18n="day-wednesday"></span></label>
              <label><input type="checkbox" name="game-days" value="Thu" /> <span data-i18n="day-thursday"></span></label>
              <label><input type="checkbox" name="game-days" value="Fri" /> <span data-i18n="day-friday"></span></label>
              <label><input type="checkbox" name="game-days" value="Sat" /> <span data-i18n="day-saturday"></span></label>
              <label><input type="checkbox" name="game-days" value="Sun" /> <span data-i18n="day-sunday"></span></label>
            </div>
          </fieldset>

          <fieldset class="config-group break-config">
            <legend data-i18n="break-config"></legend>
            <div class="field">
              <label for="start-break-hours" data-i18n="start-break"></label>
              <input
                type="number"
                id="start-break-hours"
                name="start-break-hours"
                min="0"
                max="23"
                step="1"
                data-i18n-placeholder="hour-placeholder"
              />
              <span>:</span>
              <input
                type="number"
                id="start-break-minutes"
                name="start-break-minutes"
                min="0"
                max="59"
                step="1"
                data-i18n-placeholder="minute-placeholder"
              />
            </div>
            <div class="field">
              <label for="end-break-hours" data-i18n="end-break"></label>
              <input
                type="number"
                id="end-break-hours"
                name="end-break-hours"
                min="0"
                max="23"
                step="1"
                data-i18n-placeholder="hour-placeholder"
              />
              <span>:</span>
              <input
                type="number"
                id="end-break-minutes"
                name="end-break-minutes"
                min="0"
                max="59"
                step="1"
                data-i18n-placeholder="minute-placeholder"
              />
            </div>
          </fieldset>

          <fieldset class="config-group excluded-dates">
            <legend data-i18n="excluded-dates"></legend>
            <div id="excluded-dates-list"></div>
            <button type="button" id="add-excluded-date" data-i18n="add-excluded-date"></button>
          </fieldset>

          <fieldset class="config-group output-group">
            <legend data-i18n="output"></legend>
            <div class="field">
              <label for="output-folder" data-i18n="output-folder"></label>
              <input
                type="text"
                id="output-folder"
                name="output-folder"
                readonly
                data-i18n-placeholder="output-folder-placeholder"
              />
              <button type="button" id="browse-output-folder" data-i18n="browse-output-folder"></button>
            </div>
          </fieldset>
        </div>

        <div class="generate-bar">
          <button type="button" id="generate-schedule" data-i18n="generate-schedule"></button>
          <div id="status-message" class="status-message"></div>
        </div>
      </main>
    </div>

    <div id="changelog-modal" class="modal" hidden>
      <div class="modal-content">
        <button type="button" id="close-changelog" class="modal-close">&times;</button>
        <h2 data-i18n="changelog-title"></h2>
        <div id="changelog-body"></div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
