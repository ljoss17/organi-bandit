name: Changelog

on:
  pull_request:

jobs:
  check-fragment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install towncrier
        run: pip install towncrier
      - name: Check for changelog fragment
        run: towncrier check
